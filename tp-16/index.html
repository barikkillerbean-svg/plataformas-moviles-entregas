<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Salud Mental - Consumo de APIs JSON</title>
  <!-- Vinculación con la hoja de estilos externa -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <!-- Encabezado semántico -->
    <header>
      <h1>Recursos de Salud Mental</h1>
      <p class="subtitle">Aplicación web con consumo asíncrono de APIs públicas (JSON)</p>
    </header>

    <!-- Sección de controles e interacción -->
    <main>
      <section class="controls">
        <div class="filter-group">
          <label for="select-categoria">Categoría de Test:</label>
          <select id="select-categoria">
            <option value="anxiety">Ansiedad</option>
            <option value="depression">Depresión</option>
            <option value="stress">Estrés</option>
          </select>
        </div>

        <div class="button-group">
          <button id="btn-tests" class="btn-primary">Cargar Tests Psicológicos</button>
          <button id="btn-quotes" class="btn-secondary">Frase Motivacional + Avatar</button>
          <button id="btn-limpiar" class="btn-clear">Limpiar</button>
        </div>
      </section>

      <!-- Contenedor dinámico donde JavaScript inyecta las tarjetas -->
      <section id="resultado" class="results-area" aria-live="polite">
        <p class="status">Selecciona una categoría o presiona un botón para consultar la API.</p>
      </section>
    </main>

    <!-- Pie de página -->
    <footer>
      <p>APIs integradas: Psychology & Serenity • DummyJSON • MyMemory • DiceBear</p>
    </footer>
  </div>

  <!-- Vinculación con el archivo de lógica JavaScript -->
  <script src="app.js"></script>
</body>
</html>
