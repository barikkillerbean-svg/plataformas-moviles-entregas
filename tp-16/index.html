<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bienestar y Salud Mental - Demo API</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f4f8;
      color: #334e68;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .container {
      background-color: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      max-width: 600px;
      width: 100%;
    }
    h1 {
      color: #102a43;
      text-align: center;
      font-size: 1.6rem;
      margin-bottom: 10px;
    }
    p.subtitle {
      text-align: center;
      color: #627d98;
      font-size: 0.95rem;
      margin-bottom: 25px;
    }
    .controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    button {
      background-color: #2cb1bc;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #14919b;
    }
    .card {
      background-color: #f8fafc;
      border-left: 4px solid #2cb1bc;
      padding: 15px;
      margin-bottom: 12px;
      border-radius: 6px;
    }
    .card h3 {
      margin: 0 0 6px 0;
      font-size: 1.1rem;
      color: #102a43;
    }
    .card p {
      margin: 0;
      font-size: 0.9rem;
      color: #486581;
    }
    .status {
      text-align: center;
      color: #627d98;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Recursos de Salud Mental</h1>
    <p class="subtitle">Consumo de API pública en formato JSON</p>

    <div class="controls">
      <button id="btn-tests">Cargar Tests Psicológicos</button>
      <button id="btn-quotes">Frase Motivacional Aleatoria</button>
    </div>

    <div id="resultado">
      <p class="status">Presiona un botón para consultar la API.</p>
    </div>
  </div>

  <!-- Enlace al archivo JavaScript -->
  <script src="app.js"></script>
</body>
</html>
