<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personajes Disney</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Estilos personalizados -->
    <link href="styles.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-4">
        <h1 class="text-center mb-4">Personajes de Disney</h1>
        
        <!-- Contenedor Flexbox de Bootstrap -->
        <div id="contenedor" class="d-flex flex-wrap justify-content-center gap-3">
            <p id="cargando">Cargando personajes...</p>
        </div>
    </div>

    <!-- Modal de Bootstrap para el detalle -->
    <div class="modal fade" id="modalDetalle" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitulo">Nombre</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body text-center">
                    <!-- La imagen arranca vacía y se carga recién al hacer click -->
                    <img id="modalImagen" src="" alt="Foto del personaje" class="img-fluid rounded mb-3" style="max-height: 300px;">
                    <div id="modalInfo" class="text-start"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Lógica en JavaScript estilo C -->
    <script src="script.js"></script>
</body>
</html>
